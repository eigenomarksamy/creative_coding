<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Snake with Random Colors</title>
    <script type="application/json" id="meta">
    {
        "world": "abstract",
        "worlds": ["glitch"],
        "systems": ["agents"],
        "interactions": ["autonomous"],
        "modes": ["observe"],
        "concept": "single-minded pursuit: a greedy hunter that sooner or later traps itself"
    }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="snakeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');

        const cellSize = 20; // Size of each cell
        let rows, cols;
        let snake, direction, food, snakeColor, foodColor;

        // Time between steps, and a longer one when the visitor asks for
        // reduced motion
        const STEP_MS = 100;
        const REDUCED_STEP_MS = 400;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        // Resize the canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            rows = Math.floor(canvas.height / cellSize);
            cols = Math.floor(canvas.width / cellSize);
            resetGame();
            drawGrid();
        }

        // Initialize/reset the game. Each segment carries its own hue
        function resetGame() {
            snake = [{ x: Math.floor(cols / 2), y: Math.floor(rows / 2), hue: Math.random() * 360 }];
            direction = { x: 0, y: 0 }; // Initial direction: stationary
            spawnFood();
            randomizeColors(); // Set initial colors
        }

        // Spawn food at a random position
        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * cols),
                y: Math.floor(Math.random() * rows),
            };
        }

        // Randomize colors for the snake and food
        function randomizeColors() {
            snakeColor = `hsl(${Math.random() * 360}, 50%, 50%)`;
            foodColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
        }

        // Draw the grid (snake and food)
        function drawGrid() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw the food
            ctx.fillStyle = foodColor;
            ctx.fillRect(food.x * cellSize, food.y * cellSize, cellSize, cellSize);

            // Draw the snake
            snake.forEach((segment, index) => {
                const lightness = 30 + (index * 5) % 50; // Create a gradient effect
                ctx.fillStyle = `hsl(${segment.hue}, 50%, ${lightness}%)`; // Snake gradient, each segment keeping its hue
                ctx.fillRect(segment.x * cellSize, segment.y * cellSize, cellSize, cellSize);
            });
        }

        // Move the snake
        function moveSnake() {
            const head = { ...snake[0], hue: Math.random() * 360 }; // A new segment, a new hue

            // AI Logic: Decide direction
            if (food.x > head.x) direction = { x: 1, y: 0 }; // Move right
            else if (food.x < head.x) direction = { x: -1, y: 0 }; // Move left
            else if (food.y > head.y) direction = { x: 0, y: 1 }; // Move down
            else if (food.y < head.y) direction = { x: 0, y: -1 }; // Move up

            head.x += direction.x;
            head.y += direction.y;

            // Check for collisions (walls or itself)
            if (
                head.x < 0 || head.y < 0 ||
                head.x >= cols || head.y >= rows ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)
            ) {
                resetGame();
                return;
            }

            // Add the new head
            snake.unshift(head);

            // Check if eating food
            if (head.x === food.x && head.y === food.y) {
                spawnFood(); // Spawn new food
                randomizeColors(); // Change colors when eating
            } else {
                snake.pop(); // Remove the tail if not eating
            }
        }

        // Animation loop
        let timer = null;

        function animate() {
            drawGrid();
            moveSnake();
            timer = setTimeout(animate, reducedMotion.matches ? REDUCED_STEP_MS : STEP_MS);
        }

        // Run only while the page is visible and the canvas is on screen,
        // so a background tab or a sketch scrolled out of view idles
        let pageVisible = !document.hidden;
        let onScreen = true;

        function updateRunning() {
            const shouldRun = pageVisible && onScreen;

            if (shouldRun && timer === null) {
                animate();
            } else if (!shouldRun && timer !== null) {
                clearTimeout(timer);
                timer = null;
            }
        }

        document.addEventListener('visibilitychange', () => {
            pageVisible = !document.hidden;
            updateRunning();
        });

        if ('IntersectionObserver' in window) {
            new IntersectionObserver((entries) => {
                onScreen = entries[entries.length - 1].isIntersecting;
                updateRunning();
            }).observe(canvas);
        }

        // Initialize
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        updateRunning();
    </script>
</body>
</html>
