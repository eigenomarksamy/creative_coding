<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Life - Dark Mode</title>
    <script type="application/json" id="meta">
    {
        "world": "organic",
        "systems": ["cellular-automata"],
        "interactions": ["autonomous"],
        "modes": ["observe"],
        "concept": "lifelike behavior emerging from simple local rules"
    }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="lifeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d');

        let cellSize = 10; // Size of each cell
        let rows, cols;
        let grid;
        let colors; // One color per cell position

        // Generations per second, the same on every display, and fewer
        // when the visitor asks for reduced motion
        const GENERATIONS_PER_SECOND = 30;
        const REDUCED_GENERATIONS_PER_SECOND = 4;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        // Resize canvas to full screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            rows = Math.floor(canvas.height / cellSize);
            cols = Math.floor(canvas.width / cellSize);
            grid = createGrid();
            colors = createColors();
            drawGrid();
        }

        // A random dark color for every position. A cell takes the color of
        // its position, so a cell that stays alive keeps its color instead
        // of getting a new one every frame
        function createColors() {
            return Array.from({ length: rows }, () =>
                Array.from({ length: cols }, () =>
                    `hsl(${Math.random() * 360}, 40%, ${30 + Math.random() * 20}%)`
                )
            );
        }

        // Initialize the grid with random values
        function createGrid() {
            const grid = [];
            for (let row = 0; row < rows; row++) {
                const rowArray = [];
                for (let col = 0; col < cols; col++) {
                    rowArray.push(Math.random() > 0.7 ? 1 : 0); // 30% chance of alive
                }
                grid.push(rowArray);
            }
            return grid;
        }

        // Draw the grid
        function drawGrid() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (grid[row][col] === 1) {
                        ctx.fillStyle = colors[row][col]; // Dark colors
                        ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                    }
                }
            }
        }

        // Update grid based on the Game of Life rules
        function updateGrid() {
            const newGrid = createEmptyGrid();

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const aliveNeighbors = countAliveNeighbors(row, col);

                    if (grid[row][col] === 1) {
                        // Any live cell with 2 or 3 live neighbors survives
                        newGrid[row][col] = aliveNeighbors === 2 || aliveNeighbors === 3 ? 1 : 0;
                    } else {
                        // Any dead cell with exactly 3 live neighbors becomes a live cell
                        newGrid[row][col] = aliveNeighbors === 3 ? 1 : 0;
                    }
                }
            }

            grid = newGrid;
        }

        // Create an empty grid
        function createEmptyGrid() {
            return Array.from({ length: rows }, () => Array(cols).fill(0));
        }

        // Count alive neighbors
        function countAliveNeighbors(row, col) {
            let count = 0;
            for (let r = -1; r <= 1; r++) {
                for (let c = -1; c <= 1; c++) {
                    if (r === 0 && c === 0) continue;
                    const newRow = row + r;
                    const newCol = col + c;
                    if (newRow >= 0 && newRow < rows && newCol >= 0 && newCol < cols) {
                        count += grid[newRow][newCol];
                    }
                }
            }
            return count;
        }

        // Animation loop: one generation per step, at a fixed rate
        let frame = null;
        let lastStep = null;

        function animate(now) {
            frame = requestAnimationFrame(animate);

            const perSecond = reducedMotion.matches
                ? REDUCED_GENERATIONS_PER_SECOND
                : GENERATIONS_PER_SECOND;
            const interval = 1000 / perSecond;

            if (lastStep !== null && now - lastStep < interval) {
                return;
            }

            // Keep a steady beat, but don't catch up in a burst after a stall
            lastStep = lastStep !== null && now - lastStep < interval * 2
                ? lastStep + interval
                : now;

            drawGrid();
            updateGrid();
        }

        // Run only while the page is visible and the canvas is on screen,
        // so a background tab or a sketch scrolled out of view idles
        let pageVisible = !document.hidden;
        let onScreen = true;

        function updateRunning() {
            const shouldRun = pageVisible && onScreen;

            if (shouldRun && frame === null) {
                lastStep = null;
                frame = requestAnimationFrame(animate);
            } else if (!shouldRun && frame !== null) {
                cancelAnimationFrame(frame);
                frame = null;
            }
        }

        document.addEventListener('visibilitychange', () => {
            pageVisible = !document.hidden;
            updateRunning();
        });

        if ('IntersectionObserver' in window) {
            new IntersectionObserver((entries) => {
                onScreen = entries[entries.length - 1].isIntersecting;
                updateRunning();
            }).observe(canvas);
        }

        // Initialize and start animation
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        updateRunning();
    </script>
</body>
</html>
