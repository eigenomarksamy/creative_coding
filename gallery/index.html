<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creative coding: gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <header class="site-header">
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
        <div class="site-nav" id="site-nav"></div>
    </header>

    <main id="view" class="view"></main>

    <footer class="site-footer">
        <span id="footer-note"></span>
    </footer>

    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous">&#8249;</button>
        <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next">&#8250;</button>

        <figure class="lightbox-figure">
            <img id="lightbox-image" alt="">
            <figcaption class="lightbox-caption" id="lightbox-caption"></figcaption>
        </figure>
    </div>

    <script src="gallery-data.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
